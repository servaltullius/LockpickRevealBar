; Lockpick Reveal Bar (락픽 탐지 바)
; 자물쇠 따기 화면 위쪽에 처음엔 새까만 바가 뜨고, 락픽을 대고 있는 부분만 서서히 밝아집니다.
; 밝아진 색으로 스윗스팟과의 거리를 알 수 있지만, 시도마다 팔레트/색반전/계단화가 무작위로 바뀝니다.

[General]
Enable=true
; true면 1초마다 원시 값(스윗스팟 중심/폭, 락픽 각도, 스킬)을 SKSE 로그에 기록
DebugLog=false
; auto | legacy | shifted
; auto: 1.5.x/1.6.x는 legacy, 1.7.x 이상은 shifted. 바가 전혀 안 뜨면 DebugLog로 확인 후 바꿔보세요.
Layout=auto

[Bar]
; 바를 나누는 칸 수 (칸 1개 = 180/Cells 도)
Cells=180
; 화면 너비 대비 바 너비, 화면 높이 대비 바 높이, 화면 위에서부터의 위치
WidthPct=0.45
HeightPct=0.022
TopPct=0.07
; 0 ~ 100
Alpha=92
BorderColor=0x5A5A5A
; 현재 락픽 위치 표시선
ShowPickMarker=true
MarkerColor=0xFFFFFF
; 마우스 방향과 바 방향이 반대로 느껴지면 true
FlipDirection=false

[Reveal]
; 락픽 주변으로 밝혀지는 범위(도). 잠금해제 스킬 0 -> 100 사이에서 선형 보간
RadiusAtSkill0=2.5
RadiusAtSkill100=14
; 락픽 바로 아래 칸이 1초에 밝아지는 정도 (1.0 = 1초 만에 완전히 드러남)
SpeedAtSkill0=0.45
SpeedAtSkill100=2.5
; 이 스킬 값에서 최대치 도달 (잠금해제 강화 효과 포함 현재 스킬 기준)
SkillCap=100
; 자물쇠를 돌리는(힘을 주는) 중일 때 밝혀지는 속도 배수
TurningSpeedMult=2.0
; true면 자물쇠를 돌리는 동안에만 밝혀짐
RevealOnlyWhileTurning=false
; 락픽이 떠난 칸이 다시 어두워지는 속도 (0 = 한 번 밝힌 곳은 유지)
FadePerSecond=0
; 락픽이 부러지면 밝힌 영역 초기화
ResetRevealOnPickBreak=false

[Heat]
; 먼 구간 그라데이션 곡선 (클수록 스윗스팟 근처에서만 급격히 변함)
Gamma=1.6
; true면 스윗스팟 칸을 SweetSpotColor로 확실히 표시 (가장 쉬움)
SweetSpotMarker=false
SweetSpotColor=0xFFFFFF

[Obfuscation]
; 색으로 위치를 추측하지 못하게 하는 무작위 요소. 새 자물쇠마다 다시 굴립니다.
; 락픽이 부러질 때도 다시 굴릴지
RerollOnPickBreak=true
; 색반전 확률 (0 ~ 1). 반전되면 스윗스팟이 팔레트의 "차가운" 끝 색으로 보입니다.
InvertChance=0.5
; 팔레트 무작위 선택 (false면 FixedPalette 사용)
; 0 thermal, 1 ember, 2 toxic, 3 arcane, 4 frost, 5 mono, 6 blood
RandomPalette=true
FixedPalette=0
; 그라데이션을 계단처럼 끊는 단계 수 범위와 적용 확률 (BandsMax=0이면 사용 안 함)
BandsMin=5
BandsMax=10
BandChance=0.5
; 칸마다 고정된 무작위 흔들림 (0 ~ 0.5)
Noise=0.05
